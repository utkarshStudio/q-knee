services:
  postgres:
    image: postgres:15-alpine
    container_name: qknee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hqml}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: qknee-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=/app/models
      - UPLOAD_DIR=/app/storage/uploads
      - PCA_COMPONENTS=4
      - QUANTUM_QUBITS=4
      - QUANTUM_DEPTH=2
    volumes:
      - shared_storage:/app/storage

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qknee-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hqml}
      - JWT_SECRET=${JWT_SECRET:-hqml-production-secret-change-this-min-32-chars}
      - ML_SERVICE_URL=http://ml-service:8000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173,http://localhost:80}
      - UPLOAD_DIR=/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started
    volumes:
      - shared_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3001}
    container_name: qknee-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  shared_storage:
