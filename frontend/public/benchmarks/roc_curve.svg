<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" class="rounded-lg bg-white p-2">
  <style>
    .grid { stroke: #e2e8f0; stroke-dasharray: 4,4; stroke-width: 1; }
    .axis { stroke: #64748b; stroke-width: 1.5; }
    .lbl { font-family: system-ui, sans-serif; font-size: 11px; fill: #64748b; text-anchor: middle; }
    .title { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; }
    .legend { font-family: system-ui, sans-serif; font-size: 11px; fill: #334155; }
  </style>
  <text x="250.0" y="18" text-anchor="middle" class="title">ROC Curves (Untouched Test Split)</text>
  <!-- Grid -->
  <line x1="50" y1="167.5" x2="480" y2="167.5" class="grid" />
  <line x1="265.0" y1="30" x2="265.0" y2="305" class="grid" />
  <!-- Axes -->
  <line x1="50" y1="305" x2="480" y2="305" class="axis" />
  <line x1="50" y1="30" x2="50" y2="305" class="axis" />
  <!-- Diagonal Chance -->
  <path d="M 50,305 L 480,30" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,5" fill="none" />
  <!-- Curves -->
  <path d="M 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0" stroke="#2563eb" stroke-width="2.5" fill="none" />
  <path d="M 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 50.0,305.0 L 265.0,305.0 L 265.0,305.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,30.0 L 480.0,167.5 L 480.0,167.5 L 480.0,167.5 L 480.0,305.0" stroke="#9333ea" stroke-width="2.5" fill="none" />
  <!-- Labels -->
  <text x="265.0" y="340" class="lbl">False Positive Rate (1 - Specificity)</text>
  <text x="18" y="167.5" class="lbl" transform="rotate(-90 18 167.5)">True Positive Rate (Sensitivity)</text>
  <!-- Ticks -->
  <text x="50" y="321" class="lbl">0.0</text>
  <text x="480" y="321" class="lbl">1.0</text>
  <text x="38" y="305" class="lbl">0.0</text>
  <text x="38" y="40" class="lbl">1.0</text>
  <!-- Legend -->
  <rect x="290" y="245" width="180" height="50" rx="4" fill="#f8fafc" stroke="#e2e8f0" />
  <line x1="300" y1="260" x2="320" y2="260" stroke="#2563eb" stroke-width="2.5" />
  <text x="330" y="264" class="legend">Classical SVM (AUC: 0.25)</text>
  <line x1="300" y1="280" x2="320" y2="280" stroke="#9333ea" stroke-width="2.5" />
  <text x="330" y="284" class="legend">Hybrid VQC (AUC: 0.00)</text>
</svg>